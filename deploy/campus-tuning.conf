# Global Apache tuning for the Campus Chronicle high-concurrency image.
ServerTokens Prod
ServerSignature Off
ErrorLog /proc/self/fd/2

# Connection handling
Timeout 60
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 5
ListenBacklog 2048

# Time allowed for PHP-FPM to answer (a little above request_terminate_timeout).
ProxyTimeout 70

# Slow-client (slowloris) protection: drop connections that trickle headers or
# bodies. Large admin uploads are still fine as long as they keep moving.
<IfModule reqtimeout_module>
    RequestReadTimeout header=15-30,MinRate=500 body=30,MinRate=500
</IfModule>
