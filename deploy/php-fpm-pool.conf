; PHP-FPM pool for Campus Chronicle (loaded last, overrides the image defaults).
; FPM_MAX_CHILDREN and GATEWAY_MAX_ACTIVE are sized from container memory by
; deploy/start.sh unless set explicitly.
[www]
user = www-data
group = www-data

listen = /run/php-fpm/campus.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
; Excess requests wait here (cheaply) instead of being refused.
listen.backlog = 2048

; A fixed pool means the full capacity is ready the instant a burst arrives
; (a dynamic pool spawns workers gradually, which is exactly when it hurts).
pm = static
pm.max_children = ${FPM_MAX_CHILDREN}
pm.max_requests = 500

request_terminate_timeout = 60s

; Required: without this PHP never sees DB_HOST, DB_PASSWORD, APP_ENV, ...
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

; ---- Hardening (web process only; CLI tools such as tools/backup.php are unaffected) ----
; The application never runs shell commands, so a bug or upload can't be turned into a shell.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,phpinfo
php_admin_flag[allow_url_include] = off
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
