Listen 10000
<VirtualHost *:10000>
    DocumentRoot /var/www/html
    ServerName localhost
    # Render redirects public HTTP to HTTPS and terminates TLS at its edge.
    # This container must run behind that edge; never expose it directly.
    SetEnv HTTPS on
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/data/uploads>
        Options -Indexes -ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "(?i)(Dockerfile|render\.yaml|.*\.(sh|example|conf))$">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
