# Apache event MPM — holds many open client connections on few threads.
# 12 child processes x 64 threads = 768 request workers (>500 simultaneous),
# and AsyncRequestWorkerFactor lets idle keep-alive connections exceed that.
# Processes are started lazily (StartServers 2), so memory grows only under load.
<IfModule mpm_event_module>
    StartServers              2
    ServerLimit              12
    ThreadLimit              64
    ThreadsPerChild          64
    MinSpareThreads          64
    MaxSpareThreads         256
    MaxRequestWorkers       768
    MaxConnectionsPerChild 20000
    AsyncRequestWorkerFactor  2
</IfModule>
